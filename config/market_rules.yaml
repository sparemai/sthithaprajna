# Sthitaprajna market_rules (spec A4: "no market rule is hardcoded").
#
# Every rule carries: value, status, source_url, verified_on.
#   status: VERIFIED            -> checked against a primary/official source on verified_on
#           VERIFIED_SECONDARY  -> checked against a reputable secondary source on verified_on;
#                                  confirm against the exchange circular / a Dhan contract note
#           VERIFY              -> background knowledge, NOT verified. Code may use it only in
#                                  SIM/PAPER; the go-live dossier lists it as an open item.
#           UNKNOWN             -> no trustworthy value; a placeholder used by the simulator only.
# The rules loader flags anything not re-verified in 30 days (A4) and every VERIFY/UNKNOWN rule.
# Percentages are expressed as fractions (0.0005 == 0.05%).

version: "2026-09-27"
stale_after_days: 30

rules:
