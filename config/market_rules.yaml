    value: 3510
    status: VERIFIED_SECONDARY
    verified_on: 2026-10-22
    source_url: https://www.nseindia.com/resources/exchange-communication-circulars
    note: "NSE circular NSE/FAOP/76693 (Ref 136/2026, dated 1 Oct 2026) raised the market-wide freeze qty to
      3510 effective 5 Oct 2026, up from 1800 (which had held since Apr 2026 and was this field's old
      placeholder value). Found via secondary reporting that cites the circular number/date, not a direct
      fetch of the circular PDF -- confirm against the circular itself or a Dhan contract note before
      relying on this in LIVE. One other secondary source claimed NIFTY stayed at 1800 after a Sept 2026
      update; the dated NSE circular is treated as authoritative here. Orders auto-slice above this value,
      but see the open item logged as D-050 about that slicing not yet being wired to actually submit
      multiple orders."
  freeze_qty_sensex:
    value: 1000
    status: UNKNOWN
    verified_on: null
    source_url: https://www.bseindia.com/
    note: "Unresolved as of 2026-10-22: secondary sources cite roughly 1000 units but disagree on lot-count
      attribution (100 lots vs 50 lots at a lot size of 10), and no dated 2026 BSE-specific circular was
      found (unlike NIFTY/BANKNIFTY above). BSE's own contract master file (Abridged_CO, MaxTradQty field)
      is the definitive source -- check that directly, or Dhan's Sensex options contract note, before
      trading Sensex options live at any size near this figure."
  freeze_qty_banknifty:
    value: 1440
    status: VERIFIED_SECONDARY
    verified_on: 2026-10-22
    source_url: https://www.nseindia.com/resources/exchange-communication-circulars
    note: "Same NSE circular as freeze_qty_nifty above (NSE/FAOP/76693, Ref 136/2026), effective 5 Oct 2026,
      up from this field's old placeholder value of 900."
